<!doctype html>
<html lang="tr">
  <body style="margin:0;background:#f3f5f9;font-family:Arial,Helvetica,sans-serif;color:#0b1b3f">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:32px">
            <tr><td style="font-size:20px;font-weight:bold">AdScope hesabını doğrula</td></tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6">
                Merhaba, AdScope'a {{ .Email }} adresiyle kaydoldun. Hesabını açmak için aşağıdaki düğmeye bas.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#0b1b3f;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:12px">E-posta adresimi doğrula</a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:13px;line-height:1.6;color:#626b80">
                Bağlantı bir saat geçerlidir. Bu kaydı sen yapmadıysan bu e-postayı yok sayabilirsin; hesap açılmaz.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
