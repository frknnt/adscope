<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bağlantı yok · AdScope</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fb; --card: #ffffff; --ink: #0b1b3f; --soft: #475069; --coral: #e2553a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #071430; --card: #0f2149; --ink: #f5f7fb; --soft: #b8c2da; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 28rem; background: var(--card); border-radius: 20px; padding: 28px; }
  h1 { font-size: 1.4rem; margin: 12px 0 8px; }
  p { color: var(--soft); margin: 0 0 16px; }
  button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--coral); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="48" height="48" alt="">
  <h1>İnternet bağlantısı yok</h1>
  <p>AdScope raporları ve panel çevrimdışı saklanmaz. Bağlantı geldiğinde sayfayı yeniden açabilirsin.</p>
  <button type="button" onclick="location.reload()">Yeniden dene</button>
</main>
</body>
</html>
